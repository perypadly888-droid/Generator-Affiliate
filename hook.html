<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll-Stopping Hook Generator</title>
  <style>
    :root {
      --primary: #fe2c55;
      --bg: #0f0f12;
      --card: #1e1e24;
      --text: #ffffff;
      --subtext: #a0a0ab;
      --input-bg: #2b2b36;
      --border: #2d2d38;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 30px; }
    .header { text-align: center; margin-bottom: 4px; }
    .header h1 { font-size: 1.4rem; color: var(--primary); font-weight: 800; }
    .header p { font-size: 0.85rem; color: var(--subtext); margin-top: 4px; }
    .card { background-color: var(--card); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; border: 1px solid var(--border); }
    label { font-size: 0.85rem; font-weight: 600; color: var(--subtext); }
    input { width: 100%; background-color: var(--input-bg); border: 1px solid #3f3f50; border-radius: 8px; padding: 10px; color: var(--text); font-size: 0.95rem; outline: none; margin-top: 4px; }
    input:focus { border-color: var(--primary); }
    button { background: linear-gradient(135deg, #fe2c55, #ff5277); color: white; border: none; border-radius: 8px; padding: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: opacity 0.2s; margin-top: 8px; }
    button:active { opacity: 0.8; }
    button:disabled { background: #555; cursor: not-allowed; }
    /* Agar hasil output tidak terpotong dan bisa di-scroll sampai nomor 10 */
    .output-card { 
      display: none; 
      background-color: var(--card); 
      border-radius: 12px; 
      padding: 16px; 
      border: 1px solid var(--border); 
      white-space: pre-line; 
      line-height: 1.6; 
      font-size: 0.95rem;
      max-height: 500px;
      overflow-y: auto;
    }
    .loading { display: none; text-align: center; color: var(--subtext); font-size: 0.9rem; margin: 10px 0; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>⚡ Hook Matrix Generator</h1>
    <p>Generator Hook Viral Berbasis Gemini 3.5 Flash</p>
  </div>

  <div class="card">
    <div>
      <label for="apiKey">API Key Gemini</label>
      <input type="password" id="apiKey" placeholder="Tempel API Key di sini">
    </div>

    <div>
      <label for="niche">Niche Konten / Nama Produk</label>
      <input type="text" id="niche" placeholder="Contoh: Skincare Flek Hitam / Panci Anti Lengket">
    </div>

    <div>
      <label for="audience">Target Penonton (Opsional)</label>
      <input type="text" id="audience" placeholder="Contoh: Ibu-ibu usia 30+, Anak Kos">
    </div>

    <div>
      <label for="problem">Masalah Utama (Opsional)</label>
      <input type="text" id="problem" placeholder="Contoh: Kulit kusam susah putih, Wajan lengket">
    </div>

    <button id="generateBtn" onclick="generateHooks()">Generate 10 Hook Matrix</button>
  </div>

  <div class="loading" id="loading">🚀 Memproses 10 Hook Matrix super cepat...</div>
  <div class="output-card" id="output"></div>
</div>

<script>
  document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key') || '';

  async function generateHooks() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const niche = document.getElementById('niche').value.trim();
    const audience = document.getElementById('audience').value.trim();
    const problem = document.getElementById('problem').value.trim();

    if (!apiKey) { alert('Masukkan API Key Gemini terlebih dahulu!'); return; }
    if (!niche) { alert('Niche Konten / Nama Produk wajib diisi!'); return; }

    localStorage.setItem('gemini_api_key', apiKey);

    const prompt = `Bertindaklah sebagai Pakar Viral Marketing TikTok & Reels.
Buatkan **Scroll-Stopping Hook Generator** berbasis **Hook Matrix** untuk:
- Niche/Produk: ${niche}
- Target Penonton: ${audience || 'Umum'}
- Masalah Utama: ${problem || 'Sesuai konteks niche'}

Buatkan tepat **10 Template Hook** yang siap pakai. Setiap hook wajib mengombinasikan elemen:
1. Pattern Interrupt (Menghentikan scroll penonton)
2. Psychological Trigger (Memancing emosi/penasaran)
3. Curiosity Gap (Bikin nonton sampai habis)
4. Power Words & Proven Viral Structure

Sajikan dalam bentuk nomor 1 sampai 10 dengan format singkat & jelas:
- **Hook Teks**: "..."
- **Saran Visual**: (Gerakan/Aksi kamera 2 detik pertama)
- **Elemen Matrix**: (Contoh: Pattern Interrupt + Curiosity Gap)`;

    const btn = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    const output = document.getElementById('output');

    btn.disabled = true;
    loading.style.display = 'block';
    output.style.display = 'none';

    try {
      // Menggunakan model Gemini 3.5 Flash
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      const resultText = data.candidates[0].content.parts[0].text;
      output.innerText = resultText;
      output.style.display = 'block';
    } catch (err) {
      alert('Gagal membuat hook: ' + err.message);
    } finally {
      btn.disabled = false;
      loading.style.display = 'none';
    }
  }
</script>

</body>
</html>
