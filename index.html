<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiliate Script Generator</title>
  <style>
    :root {
      --primary: #fe2c55;
      --bg: #0f0f12;
      --card: #1e1e24;
      --text: #ffffff;
      --subtext: #a0a0ab;
      --input-bg: #2b2b36;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
    .header { text-align: center; margin-bottom: 8px; }
    .header h1 { font-size: 1.4rem; color: var(--primary); }
    .header p { font-size: 0.85rem; color: var(--subtext); margin-top: 4px; }
    .card { background-color: var(--card); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #2d2d38; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--subtext); }
    input, textarea { width: 100%; background-color: var(--input-bg); border: 1px solid #3f3f50; border-radius: 8px; padding: 10px; color: var(--text); font-size: 0.95rem; outline: none; margin-top: 4px; }
    input:focus, textarea:focus { border-color: var(--primary); }
    button { background: linear-gradient(135deg, #fe2c55, #ff5277); color: white; border: none; border-radius: 8px; padding: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: opacity 0.2s; margin-top: 8px; }
    button:active { opacity: 0.8; }
    button:disabled { background: #555; cursor: not-allowed; }
    .output-card { display: none; background-color: var(--card); border-radius: 12px; padding: 16px; border: 1px solid #2d2d38; white-space: pre-line; line-height: 1.5; font-size: 0.95rem; }
    .loading { display: none; text-align: center; color: var(--subtext); font-size: 0.9rem; margin: 10px 0; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>Affiliate Generator</h1>
    <p>Buat skrip video pendek dalam hitungan detik</p>
  </div>

  <div class="card">
    <div>
      <label for="apiKey">API Key Gemini</label>
      <input type="password" id="apiKey" placeholder="Tempel API Key di sini">
    </div>
    <div>
      <label for="product">Nama Produk</label>
      <input type="text" id="product" placeholder="Contoh: Pembersih Kerak Wajan">
    </div>
    <div>
      <label for="audience">Target Penonton</label>
      <input type="text" id="audience" placeholder="Contoh: Ibu Rumah Tangga, Anak Kos">
    </div>
    <div>
      <label for="problem">Masalah Utama</label>
      <input type="text" id="problem" placeholder="Contoh: Wajan gosong hitam susah dibersihkan">
    </div>
    <div>
      <label for="features">Keunggulan Produk</label>
      <textarea id="features" rows="2" placeholder="Contoh: Tinggal semprot, tanpa menguras tenaga"></textarea>
    </div>
    <button id="generateBtn" onclick="generateScript()">Generate Skrip Video</button>
  </div>

  <div class="loading" id="loading">Memproses skrip dengan AI...</div>
  <div class="output-card" id="output"></div>
</div>

<script>
  document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key') || '';

  async function generateScript() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const product = document.getElementById('product').value.trim();
    const audience = document.getElementById('audience').value.trim();
    const problem = document.getElementById('problem').value.trim();
    const features = document.getElementById('features').value.trim();

    if (!apiKey) { alert('Masukkan API Key Gemini terlebih dahulu!'); return; }
    if (!product) { alert('Nama produk wajib diisi!'); return; }

    localStorage.setItem('gemini_api_key', apiKey);

    const prompt = `Tolong buatkan 3 pilihan skrip video pendek (TikTok/Reels/Shorts) durasi 15-30 detik untuk produk afiliasi berikut:
- Nama Produk: ${product}
- Target Penonton: ${audience || 'Umum'}
- Masalah Utama: ${problem || 'Sesuai fungsi produk'}
- Keunggulan Produk: ${features || 'Harga terjangkau dan berkualitas'}

Format setiap pilihan skrip harus jelas:
1. Hook (2 detik pertama)
2. Masalah & Solusi
3. Call to Action (CTA ke keranjang kuning/link)
4. Tanda/Saran Visual Kamera`;

    const btn = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    const output = document.getElementById('output');

    btn.disabled = true;
    loading.style.display = 'block';
    output.style.display = 'none';

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(data.error.message);

      const resultText = data.candidates[0].content.parts[0].text;
      output.innerText = resultText;
      output.style.display = 'block';
    } catch (err) {
      alert('Gagal membuat skrip: ' + err.message);
    } finally {
      btn.disabled = false;
      loading.style.display = 'none';
    }
  }
</script>

</body>
</html>
